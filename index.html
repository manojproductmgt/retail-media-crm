<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Maestro — a Retail Media CRM concept for Osmos.ai. A CRM whose pipeline is generated from platform data, not typed by reps." />
  <title>Maestro — Retail Media CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar" class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <h1 class="sidebar-wordmark">Maestro</h1>
        <span class="sidebar-subtitle">for BigBasket</span>
      </div>
      <ul class="sidebar-nav">
        <li>
          <button class="sidebar-nav-item active" data-screen="coverage" id="nav-coverage">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><rect x="1" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="1" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="1" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="10" y="10" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Coverage</span>
          </button>
        </li>
        <li>
          <button class="sidebar-nav-item" data-screen="brand-detail" id="nav-brand-detail">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="6" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M3 16c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Brand Detail</span>
          </button>
        </li>
        <li>
          <button class="sidebar-nav-item" data-screen="pipeline" id="nav-pipeline">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span>Pipeline</span>
          </button>
        </li>
        <li>
          <button class="sidebar-nav-item" data-screen="routing" id="nav-routing">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9h5M11 9h5M9 2v5M9 11v5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="9" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
            <span>Routing</span>
          </button>
        </li>
      </ul>
      <div class="sidebar-footer">
        <span class="sidebar-footer-text">Osmos.ai</span>
      </div>
    </nav>

    <!-- Main content area -->
    <main id="main-content" class="main-content">
      <!-- Screens injected by JS -->
    </main>
  </div>

  <footer class="app-footer">
    <p>All data is fictional and illustrative. Brand names are used to make the concept legible, not to represent real advertiser relationships.</p>
  </footer>

  <script src="data/seed.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
